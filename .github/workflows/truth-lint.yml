name: Truth Lint

# The archived run is evidence, so it has to stay true. This re-runs its suite and
# checks that every figure quoted about it still reproduces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: The archived run must still reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the archived suite
        run: python3 -m unittest -v runs.renamer_2026_08.test_renamer

      - name: Figures quoted in the README must match the suite
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          p = subprocess.run(["python3","-m","unittest","runs.renamer_2026_08.test_renamer"],
                             capture_output=True, text=True)
          out = p.stdout + p.stderr
          ran = int(re.search(r"Ran (\d+) tests", out).group(1))
          passed = bool(re.search(r"^OK\b", out, re.M))
          bad = []
          for f in ("README.md",):
              t = open(f).read()
              for m in re.finditer(r"Ran (\d+) tests", t):
                  if int(m.group(1)) != ran:
                      bad.append(f"{f}: claims Ran {m.group(1)}, actual {ran}")
              if "OK (skipped=" in t and not passed:
                  bad.append(f"{f}: claims the suite passes; it does not")
          if bad:
              for b in bad: print(f"::error::{b}")
              sys.exit(1)
          print(f"README figures match: Ran {ran}, {'OK' if passed else 'NOT OK'}")
          PY
