name: Truth Lint

# The Law of Truth, applied to the repository rather than to a session.
# Local hooks protect whoever has them installed; this protects everyone else —
# contributors who never ran them, and figures that were true when written and
# expired afterwards.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Every stated result must reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the suite
        run: |
          set -o pipefail
          python3 -m unittest -v $(
            find deliverables tests -name 'test_*.py' 2>/dev/null \
              | sed 's|/|.|g; s|\.py$||' | tr '\n' ' '
          ) 2>&1 | tail -20

      - name: Verify every claim in every markdown file
        run: python3 .claude/hooks/verify-claims.py

      - name: Deliverables must import only what exists
        run: |
          fail=0
          for f in $(find deliverables -name '*.py' 2>/dev/null); do
            python3 - "$f" <<'PY' || fail=1
          import ast, importlib.util, sys
          from pathlib import Path
          p = Path(sys.argv[1]); root = Path.cwd()
          tree = ast.parse(p.read_text())
          mods = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  mods.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  mods.add(n.module.split('.')[0])
          bad = []
          for m in sorted(mods):
              if m in sys.stdlib_module_names: continue
              if list(root.rglob(f'{m}.py')) or list(root.rglob(f'{m}/__init__.py')): continue
              try:
                  if importlib.util.find_spec(m) is None: bad.append(m)
              except Exception: bad.append(m)
          if bad:
              print(f'::error file={p}::fabricated dependency: {", ".join(bad)}')
              sys.exit(1)
          PY
          done
          exit $fail
